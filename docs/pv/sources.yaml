schema_version: 1
catalog_id: pv-source-catalog
updated_at: 2026-09-17

defaults:
  intended_use: noncommercial_research
  initial_trial_registry: clinicaltrials_gov
  trial_window_field: actual_study_completion_date
  trial_window_from: 2015-01-01
  trial_window_through: 2025-12-31
  trial_study_type: INTERVENTIONAL
  trial_intervention_types_any:
    - DRUG
    - BIOLOGICAL
  pilot_window_from: 2015-01-01
  pilot_window_through: 2015-12-31
  pilot_candidate_limit: 10
  pilot_included_limit: 5
  retain_permitted_fulltext: true
  destination_raw: pv_source
  destination_normalized: pv_core
  immutable_archive: gcs
  require_release_or_snapshot: true
  require_sha256: true
  require_rights_decision: true
  allow_implicit_latest: false

sources:
  - id: clinicaltrials_gov
    provider: U.S. National Library of Medicine
    domain: clinical_trials
    role: primary_registry
    access: bulk_api_and_record_history
    adapter: pv.ingest.clinicaltrials_gov
    cadence: daily
    historical_as_of: partial
    current_asset: public.trials
    rights_status: review_required
    status: pilot_implemented

  - id: eu_clinical_trials_register
    provider: European Medicines Agency
    domain: clinical_trials
    role: primary_registry
    access: registry_export
    adapter: pv.ingest.eu_ctr
    cadence: periodic
    historical_as_of: partial
    current_asset: preclin.source_document
    rights_status: review_required
    status: deferred_after_initial_collection

  - id: ctis
    provider: European Medicines Agency
    domain: clinical_trials
