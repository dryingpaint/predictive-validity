[project]
name = "predictive-validity"
version = "0.1.0"
description = "Which lines of preclinical evidence predict clinical success: data pipeline, analyses and report"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15",
    "beautifulsoup4>=4.15",
    "httpx2>=2.15",
    "lifelines>=0.30",
    "lxml>=5.3",
    "matplotlib>=3.11",
    "numpy>=2.5",
    "openai>=3.35",
    "pandas>=3.0",
    "psycopg2-binary>=2.9",
    "pyarrow>=26.0",
    "pypdf>=6.21",
    "python-dotenv[cli]>=1.2",
    "reportlab>=5.0",
    "requests>=2.34",
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "statsmodels>=0.15",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

# The repository root is pytest's rootdir, so a conftest.py in a parent checkout is never loaded.
[tool.pytest.ini_options]
testpaths = ["tests"]
