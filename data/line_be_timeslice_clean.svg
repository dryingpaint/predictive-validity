  <g id="text_27">
   <text style="font-weight: 700; font-size: 14px; font-family: 'Helvetica Neue'; text-anchor: start; fill: #14110f" x="7.2" y="17.308437" transform="rotate(-0 7.2 17.308437)">Date-cleaning removes a third to over half of the literature signal</text>
  </g>
  <g id="text_28">
   <text style="font-size: 9px; font-family: 'Helvetica Neue'; fill: #5b544e" transform="translate(7.2 42.966875)">Relative Success of the four LLM literature evidence lines (mechanistic, cell, animal, PD), before vs. after requiring the cited papers to predate the trial. The raw scores</text>
   <text style="font-size: 9px; font-family: 'Helvetica Neue'; fill: #5b544e" transform="translate(7.2 53.946031)">are hindsight-inflated; once only pre-first-trial papers count the signal drops sharply. The date-cleaned points look like they land in the genetics band — but a second,</text>
   <text style="font-size: 9px; font-family: 'Helvetica Neue'; fill: #5b544e" transform="translate(7.2 65.037406)">selection confound remains: only well-studied targets were LLM-scored at all, and within that scored subset the clean signal is near-null (B 1.06, D 0.98; C/E ~1.2–1.3).</text>
   <text style="font-size: 9px; font-family: 'Helvetica Neue'; fill: #5b544e" transform="translate(7.2 76.128781)">See report.</text>
  </g>
  <g id="text_29">
